name: IoT Edge-to-Cloud CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- CONTINUOUS INTEGRATION (CI) ---
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9" # Adjust to your Python version

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Syntax & Lint Check (flake8)
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # --- CONTINUOUS DEPLOYMENT (CD) ---
  deploy-to-ec2:
    needs: build-and-test # Only deploy if the CI tests pass
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Only deploy on the main branch
    
    steps:
    - name: Deploy Cloud Worker to AWS EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
                  cd ~
                  # Sync Code
                  git fetch origin main
                  git reset --hard origin/main
                  
                  # Kill old worker
                  sudo pkill -f lambda_worker.py || true
                  
                  # Use 'screen' to start the process in a completely detached session
                  # -d -m starts it in "detached" mode immediately
                  # -S gives the session a name so you can find it later
                  screen -d -m -S iot_worker bash -c 'python3 -u lambda_worker.py > worker.log 2>&1'
                  
                  # Small delay and a forced exit code 0 to make GitHub happy
                  sleep 1
                  echo "Deployment successful"
                  exit 0