name: IoT Edge-to-Cloud CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- CONTINUOUS INTEGRATION (CI) ---
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9" # Adjust to your Python version

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Syntax & Lint Check (flake8)
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # --- CONTINUOUS DEPLOYMENT (CD) ---
  deploy-to-ec2:
    needs: build-and-test # Only deploy if the CI tests pass
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Only deploy on the main branch
    
    steps:
    - name: Deploy Cloud Worker to AWS EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
                  # Go to your home directory where your files are
                  cd ~
                  
                  # Initialize git if it's not already a repository
                  if [ ! -d ".git" ]; then
                    git init
                    git remote add origin https://github.com/Prayas-sharmaa/FogAndEdge.git
                  fi
                  
                  # Force pull the absolute latest code from GitHub
                  git fetch --all
                  git reset --hard origin/main
                  
                  # Stop the currently running worker (using your exact file name!)
                  pkill -f lambda_worker.py || true
                  
                  # Restart your worker in the background
                  nohup python3 lambda_worker.py > worker.log 2>&1 &