name: IoT Edge-to-Cloud CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # --- CONTINUOUS INTEGRATION (CI) ---
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9" # Adjust to your Python version

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Syntax & Lint Check (flake8)
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # --- CONTINUOUS DEPLOYMENT (CD) ---
  deploy-to-ec2:
      needs: build-and-test
      runs-on: ubuntu-latest
      if: github.ref == 'refs/heads/main'
      
      steps:
      - name: Deploy via Native SSH
        run: |
          # 1. Setup the SSH Key
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 2. Run the deployment commands directly
          # -o StrictHostKeyChecking=no tells GitHub to trust your EC2 instance automatically
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            cd ~
            # Sync code
            git fetch origin main
            git reset --hard origin/main
            
            # Kill old worker
            sudo pkill -f lambda_worker.py || true
            
            # Start worker and IMMEDIATELY exit the SSH shell
            # The 'disown' ensures the process stays alive
            nohup python3 -u lambda_worker.py > worker.log 2>&1 &
            sleep 1
            exit
          EOF